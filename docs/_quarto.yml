project:
    type: website

execute:
    freeze: auto

website:
    title: MICROBE Data Portal Documentation
    page-footer: This project has received funding from the European Union’s
        Horizon Europe research and innovation programme under grant agreement
        No 101094353
    favicon: img/microbe-logo-brand.png
    page-navigation: true

    repo-url: https://github.com/ebi-metagenomics/microbe-data-portal
    repo-subdir: docs
    repo-actions: [edit, issue]

    navbar:
        right:
            - href: https://data.microbeproject.eu
              text: Data Portal

    sidebar:
        style: docked
        search: true

        contents:
            - href: index.qmd
              text: Docs home
              icon: box
            - href: datasets.qmd
            - href: website.qmd
            - href: api.ipynb
            - href: database.qmd
            - text: '---'
            - href: publications.qmd
            - text: '---'
            - href: partners.qmd

        tools:
            - icon: github
              menu:
                  - text: Data Portal Repository
                    url: https://github.com/ebi-metagenomics/microbe-data-portal
                  - text: Documentation source
                    url: https://github.com/ebi-metagenomics/microbe-data-portal/docs
            - icon: question-circle-fill
              text: Help
              href: mailto:metagenomics-help@ebi.ac.uk
format:
    html:
        theme:
            - zephyr
            - styles.scss
        toc: true
